name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --workspace @pocketfleet/api --omit=dev --audit-level=high
      - run: npx expo export --platform android --output-dir /tmp/pocketfleet-android
      - run: npx expo export --platform ios --output-dir /tmp/pocketfleet-ios
      - run: npx expo export --platform web --output-dir /tmp/pocketfleet-web
